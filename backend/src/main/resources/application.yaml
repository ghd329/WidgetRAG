spring:
  application:
    name: widgetrag-backend
  profiles:
    active: local

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
    open-in-view: false

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: none
        secure: true

logging:
  level:
    com.widgetrag: DEBUG

opensearch:
  host: localhost
  port: 9200

ai-server:
  base-url: http://localhost:8000

widgetrag:
  admin:
    # 최초 기동 시 생성할 관리자 계정. 비밀번호는 코드/설정 파일에 두지 말고
    # 환경변수(ADMIN_PASSWORD)로 주입합니다. 비워두면 관리자 계정을 만들지 않습니다.
    email: ${ADMIN_EMAIL:admin@widgetrag.com}
    password: ${ADMIN_PASSWORD:}
  storage:
    base-path: C:/Users/SMT23/WidgetRAG/widgetrag-data
  cors:
    # CORS 허용 오리진(쉼표 구분). 위젯이 설치된 고객사 도메인을 여기에 추가합니다.
    # allowCredentials=true + CSRF 비활성 조합이라 와일드카드(*)를 쓰면 안 됩니다.
    allowed-origins: http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080
