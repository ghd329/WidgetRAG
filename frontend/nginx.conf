# WidgetRag - frontend nginx 설정
#
# /api  → backend 컨테이너로 reverse proxy (CORS 및 URL 하드코딩 문제 동시 해결)
# /widget.js → backend가 서빙 (backend/src/main/resources/static/widget.js)
#              외부 쇼핑몰이 <script src="https://<도메인>/widget.js"> 로 임베드합니다.

# Docker 내장 DNS. proxy_pass에 변수를 쓰면 nginx가 시작 시점이 아니라
# 요청 시점에 이름을 해석하므로, backend 컨테이너를 재생성해 IP가 바뀌어도
# nginx를 재시작할 필요가 없습니다.
# (고정 문자열 proxy_pass는 시작 시 1회만 해석해 옛 IP를 계속 사용합니다)
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    set $backend_upstream http://backend:8080;

    # CSV 업로드 한도. application.yaml의 max-file-size=50MB와 맞춰야 합니다.
    # nginx 기본값은 1MB라 이 설정이 없으면 업로드가 413으로 실패합니다.
    client_max_body_size 50M;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 1024;

    # 이 프로젝트에는 index.html이 없습니다. 진입점을 로그인 페이지로 보냅니다.
    location = / {
        return 302 /login/company-login.html;
    }

    location /api/ {
        # 변수를 쓰면 nginx가 location 접두사를 잘라내지 않으므로
        # $request_uri로 원래 경로(/api/...)를 그대로 넘깁니다.
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/chat 은 ai-server → Ollama(LLM 생성)까지 태우므로 응답이 깁니다.
        # main_exaone.py의 requests timeout=180과 맞춥니다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    190s;
        proxy_read_timeout    190s;
    }

    # 위젯 스크립트는 backend가 서빙합니다.
    location = /widget.js {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=300";
    }

    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
