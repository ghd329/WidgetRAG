# ===========================================================
# 레지스트리 이미지 기반 기동용 오버라이드 (요구사항 3 — pull 검증)
#
#   기본 docker-compose.yml은 build: 지시자로 소스에서 빌드하지만,
#   이 파일을 겹치면 레지스트리의 이미지를 pull 받아 기동한다.
#   마이그레이션 시나리오에서 목표 환경에 전달되는 Compose 정의의 원형.
#
# 사용법:
#   docker compose -f docker-compose.yml -f docker-compose.images.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.images.yml up -d --no-build
#
# 레지스트리 전환 (실증 CSP 조합 AWS↔GCP↔NCP 대응):
#   REGISTRY_PREFIX 만 바꾸면 어느 레지스트리로든 간다 — .env 또는 명령 앞에 지정.
#     Docker Hub : REGISTRY_PREFIX=yjp8842                                    (기본값)
#     ECR (AWS)  : REGISTRY_PREFIX=<계정ID>.dkr.ecr.ap-northeast-2.amazonaws.com
#     GAR (GCP)  : REGISTRY_PREFIX=asia-northeast3-docker.pkg.dev/<프로젝트>/<저장소>
#     NCR (NCP)  : REGISTRY_PREFIX=<레지스트리>.kr.ncr.ntruss.com
#     Harbor     : REGISTRY_PREFIX=<harbor주소>/<프로젝트>
#
# 태그 규칙: IMAGE_TAG 는 고정 태그만 — latest 는 어느 이미지가 떴는지
#   추적이 안 돼서 이관 검증에 부적합. 구버전 태그는 롤백용으로 보존한다.
#   단일 리포(widgetrag)에 서비스별 태그 (무료 플랜의 프라이빗 리포 개수 제한 회피):
#     v0.1.0 = PostgreSQL·EXAONE 구성 (구버전 — 현재 compose와 비호환)
#     v0.2.0 = SQLite·Gemma·비민감화 반영 (feat/20260922-change-sqlite)
#     v0.3.0 = FK 강제(foreign_keys=true) 반영 (2026-09-23 push·pull 재기동 검증 완료)
# ===========================================================
services:
  backend:
    image: ${REGISTRY_PREFIX:-yjp8842}/widgetrag:backend-${IMAGE_TAG:-v0.3.0}
  ai-server:
    image: ${REGISTRY_PREFIX:-yjp8842}/widgetrag:ai-server-${IMAGE_TAG:-v0.3.0}
  frontend:
    image: ${REGISTRY_PREFIX:-yjp8842}/widgetrag:frontend-${IMAGE_TAG:-v0.3.0}
  llm:
    image: ${REGISTRY_PREFIX:-yjp8842}/widgetrag:llm-${IMAGE_TAG:-v0.3.0}
